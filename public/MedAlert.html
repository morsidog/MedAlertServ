<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>MedAlert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="MedAlert.css" />
  </head>
  <body>
    <section id="toolbar">
      <figure class="logo">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <rect x="10" y="1" width="6" height="24" rx="3" fill="#a78bfa"/>
          <rect x="1" y="10" width="24" height="6" rx="3" fill="#818cf8"/>
        </svg>
      </figure>
      <h3 class="titulo-toolbar">MedAlert</h3>
    </section>

    <main>
      <section id="mainmenu">
        <div class="menu-header">
          <h2 class="titulo">Panel</h2>
          <nav class="menu">
            <button class="extensor" onclick="desplegar()" type="button">
              <span>Menú</span>
              <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <ul class="opc">
              <li><button onclick="loadcuenta()" type="button">Cuenta</button></li>
              <li><button onclick="changeview('informacion')" type="button">Información de tomas</button></li>
              <li><button onclick="changeview('alarmas')" type="button">Alarmas</button></li>
            </ul>
          </nav>
        </div>

        <div class="cards">
          <article class="toma proxima">
            <span class="badge">Próxima alarma</span>
            <p class="medicamento">Paracetamol</p>
            <div class="meta">
              <span>19/04/2026</span>
              <span class="hora">10:00</span>
            </div>
          </article>

          <article class="toma ultima">
            <span class="badge">Última toma</span>
            <p class="medicamento">Jarabe</p>
            <div class="meta">
              <span>19/04/2026</span>
              <span class="hora">18:00</span>
            </div>
          </article>
        </div>
      </section>

      <section id="alarmas">
        <div class="sec-header">
          <button class="btn-back" onclick="changeviewm('mainmenu')" type="button">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M11 4L6 9l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <h1 class="titulo">Alarmas</h1>
        </div>
        <ul id="alarmlist">
          <li>
            <article class="toma">
              <span class="badge">Alarma</span>
              <p class="medicamento"></p>
              <div class="meta">
                <span>19/04/2026</span>
                <span class="hora"></span>
              </div>
            </article>
          </li>
        </ul>
      </section>

      <section id="cuenta">
        <div class="sec-header">
          <button class="btn-back" onclick="changeviewm('mainmenu')" type="button">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M11 4L6 9l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <h1 class="titulo">Cuenta</h1>     
        </div>
        <div id="cuenta-info">
          <p id="name-info">-</p>
          <p id="email-info">-</p>
          <p id="paciente-info">-</p>
          <button class="btn-n" id="f-reg" onclick="cuentasform('formregistrase')" type="button">registrarse</button>
          <button class="btn-n" id="f-log" onclick="cuentasform('formlogin')" type="button">Iniciar sesion</button>
        </div>
        <div id="formregistrase">
          <form onsubmit="registrarse(event)">
            <h1 class="titulo">Crear Nueva cuenta</h1>
            <div class="field"><label for="i-email">Email</label><input type="text" name="email" id="i-email" :invalid><span id="i-email-error"></span></div>
            <div class="field"><label for="i-newpassword">Nueva contraseña</label><input type="text" name="newpassword" id="i-newpassword" :invalid><span id="i-newpassword-error"></span></div>
            <div class="field"><label for="i-name">Tu nombre</label><input type="text" name="name" id="i-name" :invalid><span id="i-name-error"></span></div>
            <div class="keypad">
            <button class="btn-n" onclick="loadcuenta()" type="button">Cancelar</button>
            <button class="btn-n" type="submit">Registrarse</button>
            </div>
          </form>
        </div>
        <div id="formlogin">
          <form onsubmit="login(event)">
            <h1 class="titulo">Iniciar Sesion</h1>
            <div class="field"><label for="i-email-l">Email:</label><input type="text" name="email-l" id="i-email-l" :invalid><span id="i-email-l-error"></span></div>
            <div class="field"><label for="i-password">contraseña:</label><input type="text" name="password" id="i-password" :invalid><span id="i-password-error"></span></div>
            <div class="keypad">
            <button class="btn-n" onclick="loadcuenta()" type="button">Cancelar</button>
            <button class="btn-n" type="submit">Iniciar sesion</button>
            </div>
          </form>

        </div>
      </section>

      <section id="informacion">
        <div class="sec-header">
          <button class="btn-back" onclick="changeviewm('mainmenu')" type="button">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M11 4L6 9l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <h1 class="titulo">Información</h1>
        </div>
      </section>
    </main>

    <script src="./MedAlert.js"></script>
  </body>
</html>
